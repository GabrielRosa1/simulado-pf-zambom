spring.application.name=avaliacoes

# ===== Banco (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auladb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Auth0 =====
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://dev-qbwvg14beqq74513.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://dev-qbwvg14beqq74513.us.auth0.com/api/v2/}

app.auth0.namespace=https://social-insper.com/